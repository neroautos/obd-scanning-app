{% extends "base.html" %}
{% block title %}{{ title }} | AutoMind Diagnostics{% endblock %}
{% block content %}
<section class="form-page">
    <div class="form-card">
        <p class="eyebrow">Protected service storage</p>
        <h1>{{ title }}</h1>
        <form method="post" enctype="multipart/form-data" class="styled-form grid-form">
            {% csrf_token %}{{ form.non_field_errors }}
            {% for field in form %}
                <label class="{% if field.name == 'work_done' or field.name == 'notes' or field.name == 'coding_notes' or field.name == 'variant_coding_backup' %}full-row{% endif %}">{{ field.label }}{{ field }}{{ field.errors }}</label>
            {% endfor %}
            <button class="button primary full-row" type="submit">Save record</button>
        </form>
    </div>
</section>
{% endblock %}
