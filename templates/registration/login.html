{% extends "base.html" %}
{% block title %}Login | AutoMind Diagnostics{% endblock %}
{% block content %}
<section class="form-page">
    <div class="form-card narrow">
        <p class="eyebrow">Secure portal</p>
        <h1>Sign in</h1>
        <form method="post" class="styled-form">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {% for field in form %}
                <label>{{ field.label }}{{ field }}{{ field.errors }}</label>
            {% endfor %}
            <button class="button primary full" type="submit">Login</button>
        </form>
        <p class="form-foot">New customer? <a href="{% url 'register_customer' %}">Create an account</a>. Engineer? <a href="{% url 'register_engineer' %}">Apply here</a>.</p>
    </div>
</section>
{% endblock %}
